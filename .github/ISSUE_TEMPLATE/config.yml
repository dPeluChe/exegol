# Blank issues stay on: the app's bug button opens /issues/new with a prefilled title and body
blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/dPeluChe/exegol/security/advisories/new
    about: Report it privately, never in a public issue.
  - name: Questions and ideas
    url: https://github.com/dPeluChe/exegol/discussions
    about: Ask how something works or share an idea before it is a request.
